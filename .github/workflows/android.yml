name: Android CI and releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*', 'PR', 'PR-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Tests, lint, and debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test release metadata
        run: python3 -m unittest discover -s ci/tests -v
      - name: Verify Android app
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --max-workers=2 --console=plain
      - name: Upload test and lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: verification-${{ github.run_number }}
          path: |
            core/build/reports/
            core/build/test-results/
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Sign release APK
    needs: verify
    if: ${{ startsWith(github.ref, 'refs/tags/') && github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      apk_name: ${{ steps.metadata.outputs.apk_name }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
        with:
          cache-read-only: true
      - name: Validate tag and set Android version
        id: metadata
        run: python3 ci/release_metadata.py
      - name: Install Android build components
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64 secret. See docs/ci-cd.md.' >&2; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/wordtiles-signing.jks"
      - name: Build signed release
        env:
          ANDROID_SIGNING_STORE_FILE: ${{ runner.temp }}/wordtiles-signing.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          WORDTILES_VERSION_NAME: ${{ steps.metadata.outputs.version_name }}
          WORDTILES_VERSION_CODE: ${{ steps.metadata.outputs.version_code }}
        run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2 --console=plain
      - name: Verify signature and prepare release assets
        env:
          APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$APK_NAME"
          cd dist
          sha256sum "$APK_NAME" > "$APK_NAME.sha256"
      - name: Remove temporary signing key
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/wordtiles-signing.jks"
      - name: Upload signed release bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: signed-release
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: signed-release
          path: dist
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          IS_PRERELEASE: ${{ needs.package.outputs.prerelease }}
          APK_NAME: ${{ needs.package.outputs.apk_name }}
        run: |
          cd dist
          sha256sum --check "$APK_NAME.sha256"
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            if [[ "$draft" != true ]]; then
              echo "Release $RELEASE_TAG is already published; preserving its assets."
              exit 0
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes \
              --title "WordTiles $RELEASE_TAG" --prerelease="$IS_PRERELEASE" --latest=false
          fi
          gh release upload "$RELEASE_TAG" "$APK_NAME" "$APK_NAME.sha256" --clobber
          if [[ "$IS_PRERELEASE" == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
